apiVersion: 1
providers:
  - name: Capacity Dashboards
    orgId: 1
    folder: Capacity
    type: file
    disableDeletion: false
    prune: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards/Capacity
  - name: Performance Dashboards
    orgId: 1
    folder: Performance
    type: file
    disableDeletion: false
    prune: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards/Performance
  - name: Risk And Compliance Dashboards
    orgId: 1
    folder: Risk & Compliance
    type: file
    disableDeletion: false
    prune: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards/RiskAndCompliance
